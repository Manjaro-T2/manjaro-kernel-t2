name: Build Kernel Package
permissions:
  contents: write
on:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4
    - name: Build In Docker
      if: ${{ !contains(github.event.head_commit.message, '[no build]') }}
      run: |
        BUILDUSER=ltskernel
        BUILDGROUP=lts
        HOSTNAME=manjaro_build
        cat << EOF > entrypoint.sh
        set -e
        WORKDIR=/tmp/build
        groupadd -r $BUILDGROUP
        useradd $BUILDUSER -g $BUILDGROUP -m
        passwd -d $BUILDUSER
        pacman -Syu --noconfirm --needed sudo base-devel gawk bison pacman-contrib git
        printf '$BUILDUSER ALL=(ALL) ALL\\n' | tee -a /etc/sudoers
        rm -rf "\$WORKDIR"
        mkdir -p "\$WORKDIR"
        cp -a /build/. "\$WORKDIR"/
        chown -R $BUILDUSER:$BUILDGROUP "\$WORKDIR"
        cd "\$WORKDIR"
        sudo -H -u $BUILDUSER bash -lc 'cd "'"\"\$WORKDIR\""'" && updpkgsums'
        sudo -H -u $BUILDUSER gpg --keyserver keyserver.ubuntu.com --recv-keys 38DBBDC86092693E
        sudo -H -u $BUILDUSER bash -lc 'cd "'"\"\$WORKDIR\""'" && export MAKEFLAGS=j\$(nproc) && makepkg -s --noconfirm'
        cp ./*.pkg.tar.* /build/
        EOF

        docker run -h $HOSTNAME -t -v $PWD:/build archlinux /bin/bash /build/entrypoint.sh
    
    - name: Print sha512sums
      if: ${{ !contains(github.event.head_commit.message, '[no build]') }}
      run: sha512sum *.pkg.tar.*

    - name: Upload Built Packages
      if: ${{ !contains(github.event.head_commit.message, '[no build]') }}
      uses: actions/upload-artifact@v4
      with:
        name: built-packages
        path: ${{ github.workspace }}/*.pkg.tar.*

    - name: Restore Workspace Permissions
      if: ${{ github.event_name == 'workflow_dispatch' && !contains(github.event.head_commit.message, '[no build]') }}
      run: |
        sudo chown -R "$(id -u):$(id -g)" .git
        sudo find .git -type d -exec chmod u+rwx {} +
        sudo find .git -type f -exec chmod u+rw {} +
        rm -f .git/index.lock .git/config.lock .git/refs/tags/*.lock
        
    - name: Create Tag
      if: ${{ github.event_name == 'workflow_dispatch' && !contains(github.event.head_commit.message, '[no build]') }}
      id: create_tag
      run: |
        source PKGBUILD
        echo "tag=${pkgver}" >> "$GITHUB_OUTPUT"
        echo "basekernel=${_basekernel}" >> "$GITHUB_OUTPUT"
        echo "series_tag=${_basever}-lts" >> "$GITHUB_OUTPUT"
        echo "version_tag=${pkgver//./}" >> "$GITHUB_OUTPUT"
        echo "$pkgver $pkgrel"

    - name: Publish Releases
      if: ${{ github.event_name == 'workflow_dispatch' && !contains(github.event.head_commit.message, '[no build]') }}
      run: |
        series_tag="${{ steps.create_tag.outputs.series_tag }}"
        version_tag="${{ steps.create_tag.outputs.version_tag }}"
        release_name="${{ steps.create_tag.outputs.tag }}"
        release_body=$'This release packages Manjaro T2 kernel '"$release_name"$' based on Linux ${{ steps.create_tag.outputs.tag }}.\nIt includes the latest fixes and improvements for this kernel series.\nInstall packages with `sudo pacman -U <file>` using either local file paths or URLs.'

        for tag in "$series_tag" "$version_tag"; do
          gh release delete "$tag" --yes --cleanup-tag || true
          git tag -f "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag" --force
          gh release create "$tag" ./*.pkg.tar.* \
            --title "$release_name" \
            --notes "$release_body"
        done
      env:
         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
