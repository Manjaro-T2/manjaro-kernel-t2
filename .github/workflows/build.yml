name: Build Kernel Package

on:
  push:
    branches:
      - edge
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Build In Docker
        if: ${{ !contains(github.event.head_commit.message, '[no build]') }}
        run: |
          BUILDUSER=ltskernel
          BUILDGROUP=lts
          HOSTNAME=manjaro_build
          cat << EOF > entrypoint.sh
          cd /build
          groupadd -r $BUILDGROUP
          useradd $BUILDUSER -g $BUILDGROUP -m
          passwd -d $BUILDUSER
          pacman -Syu --noconfirm --needed sudo base-devel gawk bison pacman-contrib git
          updpkgsums
          printf '$BUILDUSER ALL=(ALL) ALL\n' | tee -a /etc/sudoers
          chown -R $BUILDUSER:$BUILDGROUP ./
          sudo -u $BUILDUSER gpg --keyserver keyserver.ubuntu.com --recv-keys 38DBBDC86092693E
          sudo -u $BUILDUSER bash -c 'export MAKEFLAGS=j\$(nproc) && makepkg -s --noconfirm'
          EOF

          docker run -h $HOSTNAME -t -v $PWD:/build archlinux /bin/bash /build/entrypoint.sh

      - name: Print sha512sums
        if: ${{ !contains(github.event.head_commit.message, '[no build]') }}
        run: sha512sum *.pkg.tar.*

      - name: Upload Built Packages
        if: ${{ !contains(github.event.head_commit.message, '[no build]') }}
        uses: actions/upload-artifact@v4
        with:
          name: built-packages
          path: ${{ github.workspace }}/*.pkg.tar.*

      - name: Create Tag
        if: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '[no build]') }}
        id: create_tag
        run: |
          source PKGBUILD
          echo "tag=${pkgver}" >> "$GITHUB_OUTPUT"
          echo "basekernel=${_basekernel}" >> "$GITHUB_OUTPUT"
          echo "version_tag=${pkgver//./}" >> "$GITHUB_OUTPUT"

      - name: Publish Releases
        if: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '[no build]') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version_tag="${{ steps.create_tag.outputs.version_tag }}"
          release_name="${{ steps.create_tag.outputs.tag }} - Release"
          release_body=$'This release features the newest Manjaro ${{ steps.create_tag.outputs.basekernel }} Edge\nEvery major release will recieve performance improvements, bug fixes and more.\nInstall packages with `sudo pacman -U <file>`, you can use urls or file paths.'

          tag="$version_tag"
          gh release delete "$tag" --yes --cleanup-tag || true
          git tag -f "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag" --force
          gh release create "$tag" ./*.pkg.tar.* \
            --title "$release_name" \
            --notes "$release_body"
