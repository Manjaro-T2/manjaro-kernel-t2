name: Update Edge Kernel

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update PKGBUILD To Latest Stable
        id: update
        run: python3 scripts/update_edge_kernel.py --github-output "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: steps.update.outputs.updated == 'true'
        id: create_pr
        continue-on-error: true
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.CI_GH_TOKEN || github.token }}
          commit-message: "chore: update edge kernel to ${{ steps.update.outputs.latest_version }} [no rel]"
          branch: bot/update-edge-kernel-${{ steps.update.outputs.latest_version }}
          title: "chore: update edge kernel to ${{ steps.update.outputs.latest_version }}"
          body: |
            Automated weekly update to the latest upstream Linux stable release.

            Source: https://www.kernel.org/releases.json
            Target version: `${{ steps.update.outputs.latest_version }}`
          labels: |
            automation
            dependencies

      - name: Warn When Pull Request Creation Is Blocked
        if: steps.update.outputs.updated == 'true' && steps.create_pr.outcome == 'failure'
        run: |
          echo "::warning::Update branch was pushed, but pull request creation was blocked."
          echo "::warning::Enable 'Allow GitHub Actions to create and approve pull requests' in repository settings, or add secret CI_GH_TOKEN (classic PAT with repo scope) for PR creation."

      - name: Dispatch Build Workflow
        if: always() && steps.update.outputs.updated == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "build.yml",
              ref: "bot/update-edge-kernel-${{ steps.update.outputs.latest_version }}",
            });
